<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in Space</title>
    
    <!-- Loading Tailwind CSS for layout and utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Loading Google Fonts: Space Grotesk for a modern, geometric aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #050505;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            overflow: hidden; /* Prevent scrolling to keep it immersive */
            color: #ffffff;
        }

        /* Ambient animated background orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s infinite ease-in-out alternate;
            z-index: 0;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            bottom: -150px;
            right: -100px;
            animation-delay: -5s;
        }
        
        .orb-3 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.3;
            animation-duration: 25s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* 3D Perspective container for the card */
        .perspective-container {
            perspective: 1000px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            padding: 1.5rem;
        }

        /* Glassmorphism card with 3D transform properties */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
            transition: transform 0.1s ease;
            position: relative;
            overflow: hidden;
        }

        /* Subtle inner shine on the card */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-20deg);
            animation: shine 8s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        /* Elements inside the card need a Z-translation for the parallax effect */
        .parallax-element {
            transform: translateZ(30px);
        }
        
        .parallax-element-heavy {
            transform: translateZ(60px);
        }

        /* Glowing text effect for the massive 404 */
        .text-glow {
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- Decorative background orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Main container enabling 3D perspective -->
    <div class="perspective-container" id="container">
        
        <!-- The Glassmorphism Card -->
        <div class="glass-card w-full max-w-2xl p-8 md:p-16 flex flex-col items-center justify-center text-center" id="card">
            
            <!-- 404 Number -->
            <h1 class="parallax-element-heavy text-7xl md:text-9xl font-bold tracking-tighter mb-4 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-300 to-blue-400 text-glow">
                404
            </h1>
            
            <!-- Error Title -->
            <h2 class="parallax-element text-2xl md:text-4xl font-semibold mb-6 text-white/90">
                You've strayed into the void.
            </h2>
            
            <!-- Error Description -->
            <p class="parallax-element text-base md:text-lg text-white/60 mb-10 max-w-md mx-auto leading-relaxed">
                The page you are looking for has been moved, deleted, or never existed in this dimension. Don't worry, even the best explorers get lost sometimes.
            </p>
            
        </div>
    </div>

    <script>
        // Select the card and the main window for events
        const card = document.getElementById('card');
        
        // 3D Parallax Effect on Mouse Move
        document.addEventListener('mousemove', (e) => {
            // Get screen dimensions
            const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
            
            // Apply calculated rotation to the card
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Reset the card position smoothly when mouse leaves the window
        document.addEventListener('mouseleave', () => {
            card.style.transition = 'transform 0.5s ease-out';
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        // Remove the transition delay when mouse enters for snappy tracking
        document.addEventListener('mouseenter', () => {
            // Wait a tiny bit for the reset transition to finish if they just left
            setTimeout(() => {
                card.style.transition = 'transform 0.1s ease';
            }, 10);
        });
        
        // Ensure touch devices have a subtle floating effect since they lack mouse tracking
        if ('ontouchstart' in window) {
            let floatDirection = 1;
            let currentY = 0;
            
            setInterval(() => {
                currentY += 0.5 * floatDirection;
                if(Math.abs(currentY) > 5) floatDirection *= -1;
                
                card.style.transition = 'transform 1s ease-in-out';
                card.style.transform = `translateY(${currentY}px)`;
            }, 50);
        }
    </script>
</body>
</html>
