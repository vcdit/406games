<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Crucial for mobile responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 - Lost in Space</title>
    
    <!-- Loading Tailwind CSS for adaptive layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Loading Google Fonts: Space Grotesk for a modern, geometric aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #050505;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            /* Prevent scrolling and elastic bounce on mobile */
            overflow: hidden; 
            width: 100vw;
            /* Fallback for older browsers, dvh for modern mobile browsers to handle address bars */
            height: 100vh;
            height: 100dvh;
            color: #ffffff;
            overscroll-behavior: none;
        }

        /* Ambient animated background orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: drift 20s infinite ease-in-out alternate;
            z-index: 0;
            /* Ensure orbs don't block pointer events */
            pointer-events: none;
        }

        .orb-1 {
            width: 50vmin; /* Responsive sizing based on viewport */
            height: 50vmin;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            top: -10%;
            left: -10%;
        }

        .orb-2 {
            width: 60vmin;
            height: 60vmin;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            bottom: -15%;
            right: -10%;
            animation-delay: -5s;
        }
        
        .orb-3 {
            width: 40vmin;
            height: 40vmin;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.2;
            animation-duration: 25s;
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(5vw, -5vh) scale(1.1); }
            66% { transform: translate(-3vw, 3vh) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .perspective-container {
            perspective: 1000px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            padding: 1rem;
            box-sizing: border-box;
        }

        /* Continuous gentle float using CSS (safe for all devices) */
        .floating-wrapper {
            animation: gentle-float 6s infinite ease-in-out;
            width: 100%;
            display: flex;
            justify-content: center;
            /* Ensures 3D transform is passed down to the card */
            transform-style: preserve-3d; 
        }

        @keyframes gentle-float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
            transition: transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            will-change: transform;
        }

        /* Subtle inner shine on the card */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-20deg);
            animation: shine 8s infinite;
            pointer-events: none;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        /* Elements inside the card need a Z-translation for the parallax effect */
        .parallax-element {
            transform: translateZ(30px);
        }
        
        .parallax-element-heavy {
            transform: translateZ(60px);
        }

        /* Glowing text effect for the massive 404 */
        .text-glow {
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- Decorative background orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Main container enabling 3D perspective -->
    <div class="perspective-container" id="container">
        
        <!-- Separating the CSS float from the JS 3D rotation prevents conflicts -->
        <div class="floating-wrapper w-full max-w-2xl">
            
            <!-- The Glassmorphism Card (Responsive padding and sizing) -->
            <div class="glass-card w-full p-8 sm:p-12 md:p-16 flex flex-col items-center justify-center text-center mx-4" id="card">
                
                <!-- Responsive 404 Number -->
                <h1 class="parallax-element-heavy text-6xl sm:text-7xl md:text-9xl font-bold tracking-tighter mb-2 sm:mb-4 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-300 to-blue-400 text-glow">
                    404
                </h1>
                
                <!-- Error Title (Scales for mobile) -->
                <h2 class="parallax-element text-xl sm:text-2xl md:text-4xl font-semibold mb-4 sm:mb-6 text-white/90">
                    You've strayed into the void.
                </h2>
                
                <!-- Error Description (Scales for readability) -->
                <p class="parallax-element text-sm sm:text-base md:text-lg text-white/60 max-w-md mx-auto leading-relaxed">
                    The page you are looking for has been moved, deleted, or never existed in this dimension. Don't worry, even the best explorers get lost sometimes.
                </p>
                
            </div>
        </div>
    </div>

    <script>
        const card = document.getElementById('card');
        const container = document.getElementById('container');
        
        // Track whether we are actively touching the screen to pause mouse calculations
        let isTouchDevice = false;

        // Prevent default touch behaviors like scrolling to keep it locked in place
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        // Detect touch devices
        window.addEventListener('touchstart', () => {
            isTouchDevice = true;
        }, { once: true });

        // 3D Parallax Effect on Mouse Move
        document.addEventListener('mousemove', (e) => {
            // Disable 3D follow effect on touch devices as it causes jitter
            if (isTouchDevice) return;

            // Calculate rotation based on center of screen
            // Reduced the divisor (80 instead of 40) for a more subtle, premium feel
            const xAxis = (window.innerWidth / 2 - e.pageX) / 80;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 80;
            
            // Limit the maximum rotation to prevent the card from flipping too much
            const clampedX = Math.max(-15, Math.min(15, xAxis));
            const clampedY = Math.max(-15, Math.min(15, yAxis));
            
            card.style.transform = `rotateY(${clampedX}deg) rotateX(${clampedY}deg)`;
        });

        // Reset the card position smoothly when mouse leaves the window
        document.addEventListener('mouseleave', () => {
            if (isTouchDevice) return;
            card.style.transition = 'transform 0.5s ease-out';
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        // Remove the long transition delay when mouse enters for snappy tracking
        document.addEventListener('mouseenter', () => {
            if (isTouchDevice) return;
            // Short delay to allow smooth reset transition to finish if just triggered
            setTimeout(() => {
                card.style.transition = 'transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            }, 50);
        });
        
    </script>
</body>
</html>
