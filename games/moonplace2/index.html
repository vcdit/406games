<style>
:root{color-scheme:dark;--bg:#0c1522;--ink:#efe6d2;--dim:#b9ad96;--gold:#e7b85a;--panel:rgba(16,26,40,.93);--ho:.2}
:root:not([data-theme="light"]){--bg:#0c1522}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IM Fell English",Georgia,"Noto Serif",serif;overflow:hidden;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}

#top button{font-size:18px;padding:4px 10px;border-radius:10px}
#inv{display:flex;gap:6px;margin-left:6px;direction:ltr}
.chip{border:1px solid var(--gold);color:var(--gold);padding:2px 10px;border-radius:14px;font-style:italic;font-size:15px;background:rgba(0,0,0,.35);cursor:pointer}
.chip.on{background:var(--gold);color:#1a1630}

svg{width:100%;height:100%;display:block}

#ttl{color:var(--gold);font-size:17px}
#txt{margin:2px 0 0;font-size:17px;line-height:1.4}
#txt.f{animation:f .6s}@keyframes f{from{opacity:0}}
.hs{cursor:pointer}.halo{opacity:var(--ho)}
.an .halo{animation:p 3.2s ease-in-out infinite}
@keyframes p{50%{opacity:calc(var(--ho)*.3)}}
#bl,#fg,#vg{position:absolute;inset:0;pointer-events:none;display:none}
body.blood #bl{display:block}
#bl i{position:absolute;top:-40%;width:5px;height:40%;background:linear-gradient(#8a0010,#c0121f);border-radius:0 0 4px 4px;animation:dr 5s linear infinite}
@keyframes dr{to{transform:translateY(300%)}}
body.fog #fg{display:block;background:radial-gradient(ellipse at 30% 100%,rgba(200,215,235,.18),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(200,215,235,.12),transparent 55%)}
body.vig #vg{display:block;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,10,.55))}
.scr{position:fixed;inset:0;z-index:20;background:rgba(8,14,24,.97);display:flex;padding:7vh 6vw}
.h{display:none!important}
#menu{align-items:center;justify-content:space-between}
#mt{font-size:min(8.5vw,12vh);line-height:1;margin:0;font-weight:400;max-width:52vw}
#sb{font-size:min(3.4vw,4.6vh);color:var(--gold);margin:10px 0 0;font-style:italic}
#mm{width:min(38vh,34vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 35%,#f4f6ef,#d5d8cb 55%,#9aa1a0);box-shadow:0 0 90px 24px rgba(200,220,235,.28);animation:gl 6s ease-in-out infinite}
@keyframes gl{50%{box-shadow:0 0 130px 40px rgba(200,220,235,.42)}}
#mb{position:fixed;bottom:6vh;left:0;right:0;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
button{font:inherit;font-size:19px;background:rgba(0,0,0,.35);color:var(--gold);border:1px solid var(--gold);padding:8px 22px;border-radius:22px;cursor:pointer}
button.on{background:var(--gold);color:#1a1630}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.pn{flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;overflow:auto}
.pn h2{font-weight:400;margin:0;font-size:26px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#md{position:fixed;inset:0;z-index:25;background:rgba(4,8,16,.82);display:flex;align-items:center;justify-content:center;padding:14px}
#md>div{background:#16223a;border:1px solid var(--gold);border-radius:14px;padding:18px 26px;max-width:min(560px,92vw);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
#md p{margin:0;font-size:19px;line-height:1.5}
.dl{display:flex;gap:20px}.dl div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:38px}
.dl button{padding:0 14px;font-size:16px}
#rot{position:fixed;inset:0;z-index:50;background:#08101a;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:22px}
@media (orientation:portrait){#rot{display:flex}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
